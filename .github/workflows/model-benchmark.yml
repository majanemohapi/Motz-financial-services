name: Loan model benchmark

on:
  workflow_dispatch:
  push:
    paths:
      - "data/train.csv"
      - "tools/model_benchmark.py"
      - ".github/workflows/model-benchmark.yml"

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install benchmark dependencies
        run: python -m pip install --upgrade pip pandas numpy scikit-learn

      - name: Run stratified cross-validation benchmark
        run: |
          python tools/model_benchmark.py | tee benchmark-output.txt

      - name: Publish benchmark summary
        if: always()
        run: |
          {
            echo "## Loan model benchmark"
            echo
            echo "Five-fold stratified out-of-fold comparison. Research benchmark only; not calibrated lending probability."
            echo
            if [ -f benchmark-output.txt ]; then
              echo 'JSON RESULTS'
              cat benchmark-output.txt
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload benchmark report
        uses: actions/upload-artifact@v4
        with:
          name: loan-model-benchmark
          path: |
            benchmark-results.json
            benchmark-output.txt
          if-no-files-found: warn
